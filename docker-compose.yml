services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: hms_dev_pw
      POSTGRES_DB: hmsdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms -d hmsdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-before-deploying}
      DEBUG: "0"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      DATABASE_URL: postgres://hms:hms_dev_pw@db:5432/hmsdb
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
